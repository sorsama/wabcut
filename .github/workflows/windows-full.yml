# Full Windows build (win-msvc preset): app, CLI, AI helpers and every test suite except those needing a GPU or an audio
# device (ctest preset win-msvc-ci), including the install tests (install.smoke; install.package builds the MSI and the
# portable ZIP and installs, runs and uninstalls the MSI for the runner's user). The MSI and the ZIP are the artifacts.
# The vcpkg packages and the compiler cache it saves on main are what pull requests and the release workflow's Windows
# job restore (tools/ci-cache.py). See docs/building.md and docs/release.md.
name: windows-full

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared runners are slower than a developer machine: wall-clock budgets in the tests get 4x headroom.
  WABCUT_TIMING_SLACK: 4
  # The runner has no GPU (Microsoft Basic Render Driver): the media tests skip their hardware-decoder checks
  # (tests/media/TestMedia.h, gpuExpected()); the tests that need a GPU are excluded by label (win-msvc-ci).
  WABCUT_TEST_NO_GPU: 1
  QT_VERSION: 6.11.3
  # aqtinstall 3.3.0, the latest release, cannot read the per-arch repository layout Qt uses since 6.11. The fix
  # (miurahr/aqtinstall#1000) is only on master, so install aqtinstall from a pinned master commit.
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: win-msvc
    runs-on: windows-2025
    # The first run builds FFmpeg, x264 and x265 from source; later runs restore them from the binary cache.
    timeout-minutes: 300
    permissions:
      contents: read
      # A run that saves caches deletes its branch's older ones (tools/ci-cache.py delete-older).
      actions: write
    env:
      CCACHE_KEY: ccache-win-msvc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: vcpkg at the manifest baseline
        id: vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          $cache = Join-Path $env:RUNNER_TEMP vcpkg-cache
          git clone --quiet https://github.com/microsoft/vcpkg $root
          git -C $root checkout --quiet $baseline
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "cache=$cache" >> $env:GITHUB_OUTPUT
          # The cache is named by the packages it holds (tools/ci-cache.py vcpkg-key) and saved from main; pull requests
          # and releases restore main's newest. Package ABIs include the compiler, so vcpkg reuses the packages that still
          # match and builds the rest. The second prefix finds the caches named the old way (image version and file
          # hashes).
          "prefix=vcpkg-$env:ImageOS-win-msvc-" >> $env:GITHUB_OUTPUT
          "legacy=vcpkg-$env:ImageOS-" >> $env:GITHUB_OUTPUT

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg.outputs.prefix }}newest
          restore-keys: |
            ${{ steps.vcpkg.outputs.prefix }}
            ${{ steps.vcpkg.outputs.legacy }}

      # Wabcut's own objects: saved from main after a successful build, restored by everything else (tools/ci-cache.py).
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: ccache-win-msvc-

      # Without ccache (a failed download) the build runs as before, only slower.
      - name: ccache
        id: ccache
        continue-on-error: true
        shell: pwsh
        run: python tools/ci-cache.py ccache-setup --max-size 2G ${{ github.ref != 'refs/heads/main' && '--read-only' || '' }}

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      # The MSI: WiX 5.0.2 as a per-user .NET tool (docs/release.md, "Why WiX, and which WiX").
      - name: WiX Toolset
        shell: pwsh
        run: ./cmake/packaging/Install-WixToolset.ps1

      - name: Configure and build
        id: build
        shell: pwsh
        run: |
          $env:WABCUT_QT_DIR = $env:QT_ROOT_DIR
          . ./tools/dev-env.ps1
          $launcher = @()
          if ($env:CCACHE_EXE) { $launcher = "-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE_EXE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE_EXE" }
          cmake --preset win-msvc -DWABCUT_BUILD_NUMBER=${{ github.run_number }} @launcher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset win-msvc
          exit $LASTEXITCODE

      - name: Compiler cache statistics
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: pwsh
        run: python tools/ci-cache.py ccache-finish ${{ github.ref == 'refs/heads/main' && steps.build.outcome == 'success' && '--trim' || '' }}

      # Saved straight after the build, not after the tests, so a release started meanwhile already finds it.
      - name: Save the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache.outcome == 'success' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: vcpkg cache key
        id: vcpkg-key
        if: always() && steps.vcpkg.outcome == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: python tools/ci-cache.py vcpkg-key --build-dir build/win-msvc --cache "${{ steps.vcpkg.outputs.cache }}" --prefix "${{ steps.vcpkg.outputs.prefix }}"

      # Saved even when a later step fails, so the next run does not rebuild FFmpeg; not when nothing new was built. A run
      # started by hand on another branch saves it for that branch (a branch that changes the dependencies).
      - name: Save the vcpkg binary cache
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.vcpkg-key.outputs.key != '' && steps.vcpkg-key.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg-key.outputs.key }}

      # One cache of each kind per branch: older ones only take room from the repository's 10 GB.
      - name: Delete older caches
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_KEY: ${{ steps.vcpkg-key.outputs.key }}
        run: |
          python tools/ci-cache.py delete-older --ref $env:GITHUB_REF --prefix ccache-win-msvc- --keep $env:CCACHE_KEY
          if ($env:VCPKG_KEY) {
            python tools/ci-cache.py delete-older --ref $env:GITHUB_REF --prefix "${{ steps.vcpkg.outputs.prefix }}" --keep $env:VCPKG_KEY
          }

      - name: Test (without gpu and audio-device tests)
        shell: pwsh
        run: |
          $env:WABCUT_QT_DIR = $env:QT_ROOT_DIR
          . ./tools/dev-env.ps1
          ctest --preset win-msvc-ci
          exit $LASTEXITCODE

      - name: Package
        shell: pwsh
        run: |
          $env:WABCUT_QT_DIR = $env:QT_ROOT_DIR
          . ./tools/dev-env.ps1
          cpack --config build/win-msvc/CPackConfig.cmake
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        with:
          name: wabcut-windows-x64
          path: |
            build/win-msvc/package/*.msi
            build/win-msvc/package/*-portable.zip
          if-no-files-found: error
