# Core gate: model, command, keymap, interchange and ai (no Qt, FFmpeg or vcpkg) on Windows (MSVC and clang-cl), Linux
# (GCC 14) and macOS (Homebrew LLVM: Apple Clang's libc++ lacks std::jthread and floating-point from_chars). Same commands
# as a local core build (docs/building.md): cmake --preset core, build, ctest. clang-cl catches what MSVC accepts and other
# compilers do not. CI builds without debug information (WABCUT_DEBUG_INFO=OFF) through ccache (tools/ci-cache.py: every
# branch and pull request saves its own cache) and runs the tests in parallel with one rerun of a failed test
# (tools/ci-test.py).
name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared runners are slower and noisier than a developer machine: wall-clock budgets in the tests get 4x headroom
  # (tests/model/TimelineFixture.h, timingSlack()). Local runs keep the strict budgets.
  WABCUT_TIMING_SLACK: 4

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: msvc
          - os: windows-2025
            name: clang-cl
            cc: clang-cl
            cxx: clang-cl
          - os: ubuntu-24.04
            name: gcc-14
            cc: gcc-14
            cxx: g++-14
            # Known Linux gaps: seven tests that fail off Windows for a cause nobody has fixed yet, each with its reason in
            # tests/platform-gaps.json (tools/ci-known-gaps.py turns the table into the exclusion). They are left out of
            # the gate, run apart ("Known-gap tests") so their failure output is in the log, and every other test must pass.
            gaps: linux
          - os: macos-15
            name: llvm
            llvm: true
            # The same Homebrew LLVM setup as unix-full: its clang, its libc++ and the run-time path to it.
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-llvm.cmake
            # Known gaps off Windows, as on Linux above (four of the seven).
            gaps: macos
    name: core (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A cold MSVC build of the core took about 43 minutes with debug information; the compiler cache makes later runs
    # compile only what changed.
    timeout-minutes: 60
    permissions:
      contents: read
      # A run that saves its compiler cache deletes the branch's older ones (tools/ci-cache.py delete-older).
      actions: write
    env:
      CCACHE_KEY: ccache-core-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7

      - name: CMake and Ninja
        if: runner.os != 'Windows'
        uses: lukka/get-cmake@v4.4.5

      - name: Homebrew LLVM (macOS)
        if: matrix.llvm
        run: |
          brew install llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      # Wabcut's own objects (tools/ci-cache.py): a pull request restores its own newest cache, else main's.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: ccache-core-${{ matrix.name }}-

      # Without ccache (a failed download) the build runs as before, only slower.
      - name: ccache
        id: ccache
        continue-on-error: true
        shell: bash
        run: $PYTHON tools/ci-cache.py ccache-setup --max-size 1G

      - name: Configure and build (Windows)
        id: build-windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # The runner has MinGW on PATH; make CMake pick MSVC (or clang-cl, from the image's LLVM, with MSVC's library).
          CC: ${{ matrix.cc || 'cl' }}
          CXX: ${{ matrix.cxx || 'cl' }}
        run: |
          . ./tools/dev-env.ps1 -Core
          $launcher = @()
          if ($env:CCACHE_EXE) { $launcher = "-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE_EXE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE_EXE" }
          cmake --preset core -DWABCUT_DEBUG_INFO=OFF @launcher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # -k 0: a failed build still compiles everything else, so one run shows every error.
          cmake --build --preset core -- -k 0
          exit $LASTEXITCODE

      - name: Configure and build (Linux, macOS)
        id: build-unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}; fi
          cmake --preset core ${{ matrix.configure }} -DWABCUT_DEBUG_INFO=OFF \
            ${CCACHE_EXE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_EXE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_EXE}
          cmake --build --preset core -- -k 0

      # A build with errors still compiled everything it could (-k 0), so its cache is worth keeping too; one that
      # compiled nothing (a failed configure) is not saved.
      - name: Compiler cache statistics
        id: ccache-stats
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: $PYTHON tools/ci-cache.py ccache-finish ${{ (steps.build-windows.outcome == 'success' || steps.build-unix.outcome == 'success') && '--trim' || '' }}

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache-stats.outputs.compiled != '' && steps.ccache-stats.outputs.compiled != '0' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}

      # One compiler cache per configuration and branch or pull request: older ones only take room from the 10 GB.
      - name: Delete older caches
        if: ${{ !cancelled() && steps.ccache-stats.outputs.compiled != '' && steps.ccache-stats.outputs.compiled != '0' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PYTHON tools/ci-cache.py delete-older --ref "$GITHUB_REF" --prefix "ccache-core-${{ matrix.name }}-" --keep "$CCACHE_KEY"

      # One job per processor; a test that fails runs again alone, and only a second failure fails the job (a flaky
      # test is listed as a warning instead). [perf] tests run alone (RUN_SERIAL).
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc || 'cl' }}
          CXX: ${{ matrix.cxx || 'cl' }}
        run: |
          . ./tools/dev-env.ps1 -Core
          python tools/ci-test.py --build-dir build/core -- --preset core
          exit $LASTEXITCODE

      - name: Test (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exclude="$(python3 tools/ci-known-gaps.py "${{ matrix.gaps }}")"
          if [ -n "$exclude" ]; then
            python3 tools/ci-test.py --build-dir build/core -- --preset core -E "$exclude"
          else
            python3 tools/ci-test.py --build-dir build/core -- --preset core
          fi

      # The known-gap tests (tests/platform-gaps.json) run on their own, never failing the job: their output says why they
      # fail here, and a run where they all pass says the table can lose them.
      - name: Known-gap tests (information only)
        if: ${{ !cancelled() && runner.os != 'Windows' && matrix.gaps != '' }}
        shell: bash
        run: |
          gaps="$(python3 tools/ci-known-gaps.py "${{ matrix.gaps }}")"
          if ctest --preset core -R "$gaps" --output-on-failure; then
            echo "::notice title=Known gaps::every known-gap test passed on ${{ matrix.gaps }}: remove them from tests/platform-gaps.json"
          else
            echo "::notice title=Known gaps::some known-gap tests still fail on ${{ matrix.gaps }} (the reasons are in tests/platform-gaps.json)"
          fi

      # A failed toolchain check says only that it failed: the configure log has the compiler's own error.
      - name: CMake configure log (after a failure)
        if: failure()
        shell: bash
        run: |
          log=build/core/CMakeFiles/CMakeConfigureLog.yaml
          if [ -f "$log" ]; then tail -n 200 "$log"; else echo "no configure log"; fi
