# Core gate: model, command, keymap, interchange and ai (no Qt, FFmpeg or vcpkg) on Windows (MSVC and clang-cl), Linux
# (GCC 14) and macOS (Homebrew LLVM: Apple Clang's libc++ lacks std::jthread and floating-point from_chars). Same commands
# as a local core build (docs/building.md): cmake --preset core, build, ctest. clang-cl catches what MSVC accepts and other
# compilers do not.
name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared runners are slower and noisier than a developer machine: wall-clock budgets in the tests get 4x headroom
  # (tests/model/TimelineFixture.h, timingSlack()). Local runs keep the strict budgets.
  WABCUT_TIMING_SLACK: 4

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: msvc
          - os: windows-2025
            name: clang-cl
            cc: clang-cl
            cxx: clang-cl
          - os: ubuntu-24.04
            name: gcc-14
            cc: gcc-14
            cxx: g++-14
            # Known Linux/macOS gaps, not yet brought up (Wabcut is developed and tested on Windows; README "Project
            # status"): the local AI helper's port-conflict guard, the search index's saved graph, the recorded
            # llama-server arguments and transcript corrections (0.2: and the transcript's Find and Replace, which
            # corrects words the same way) fail off Windows. Every other test must pass.
            ctest_exclude: "Managed local helper lifecycle|HNSW graph agrees|llama-server starts with the tier context|Transcript corrections apply on top|transcript.find lists the matches|transcript.findReplace corrects every match"
          - os: macos-15
            name: llvm
            llvm: true
            # The same Homebrew LLVM setup as unix-full: its clang, its libc++ and the run-time path to it.
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-llvm.cmake
            # Known gaps off Windows, as on Linux above.
            ctest_exclude: "Managed local helper lifecycle|HNSW graph agrees|llama-server starts with the tier context"
    name: core (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: CMake and Ninja
        if: runner.os != 'Windows'
        uses: lukka/get-cmake@v4.4.2

      - name: Homebrew LLVM (macOS)
        if: matrix.llvm
        run: |
          brew install llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Configure, build, test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # The runner has MinGW on PATH; make CMake pick MSVC (or clang-cl, from the image's LLVM, with MSVC's library).
          CC: ${{ matrix.cc || 'cl' }}
          CXX: ${{ matrix.cxx || 'cl' }}
        run: |
          . ./tools/dev-env.ps1 -Core
          cmake --preset core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # -k 0: a failed build still compiles everything else, so one run shows every error.
          cmake --build --preset core -- -k 0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset core
          exit $LASTEXITCODE

      - name: Configure, build, test (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}; fi
          cmake --preset core ${{ matrix.configure }}
          cmake --build --preset core -- -k 0
          if [ -n "${{ matrix.ctest_exclude }}" ]; then
            ctest --preset core -E "${{ matrix.ctest_exclude }}"
          else
            ctest --preset core
          fi

      # A failed toolchain check says only that it failed: the configure log has the compiler's own error.
      - name: CMake configure log (after a failure)
        if: failure()
        shell: bash
        run: |
          log=build/core/CMakeFiles/CMakeConfigureLog.yaml
          if [ -f "$log" ]; then tail -n 200 "$log"; else echo "no configure log"; fi
