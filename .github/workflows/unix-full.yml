# EXPERIMENTAL full builds on Linux and macOS (linux-gcc / macos-clang presets): the app, the CLI, every test suite but
# the GPU and audio-device ones, and the install tree. Windows is the verified platform; these jobs show how far the
# other two are and never block (docs/release.md, "Platform status": CI-ready, unverified locally). Runs on every push to
# main, weekly and on demand: the first build of FFmpeg, x264 and x265 from source takes hours (the vcpkg binary cache
# keeps them). The caches it saves on main are the ones the release workflow's Linux and macOS jobs restore
# (tools/ci-cache.py): the vcpkg packages and the compiler cache.
#
# Dependency set: the same vcpkg manifest as Windows, with local AI off (whisper.cpp / ggml are not measured on these
# platforms yet: WABCUT_WITH_LOCAL_AI=OFF) and smart search on Microsoft's prebuilt ONNX Runtime for the platform
# (Linux x64 and macOS arm64 archives, overlay port cmake/ports/onnxruntime-prebuilt). Provider keys use the OS keychain
# (libsecret on Linux, the Keychain on macOS). No secrets are used: cloud AI tests run against recorded fixtures.
#
# macOS builds with Homebrew's LLVM (libc++ 20+): Apple Clang's libc++ lacks std::jthread and floating-point
# std::from_chars. cmake/toolchains/macos-llvm.cmake and the arm64-osx-llvm triplet use it for Wabcut and every port.
name: unix-full (experimental)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A push to main queues behind the running build instead of cancelling it, so every build that gets far enough saves its
# caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Shared runners are slower than a developer machine: wall-clock budgets in the tests get 4x headroom.
  WABCUT_TIMING_SLACK: 4
  QT_VERSION: 6.11.3
  # aqtinstall 3.3.0, the latest release, cannot read the per-arch repository layout Qt uses since 6.11 (fixed by
  # miurahr/aqtinstall#1000 on master only), so install aqtinstall from a pinned master commit.
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: ${{ matrix.preset }} (experimental)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-gcc
            # GCC 14 (the image's default is 13; both pass the toolchain check, 14 is what docs/building.md lists).
            configure: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
            ccache_size: 2500M
          - os: macos-15
            preset: macos-clang
            # An absolute path: CMake's compiler checks include the toolchain from their own scratch projects.
            configure: -DVCPKG_TARGET_TRIPLET=arm64-osx-llvm -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchains/macos-llvm.cmake
            ccache_size: 1500M
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      # A run that saves caches deletes its branch's older ones (tools/ci-cache.py delete-older).
      actions: write
    env:
      CCACHE_KEY: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: lukka/get-cmake@v4.4.4

      # Plus the xcb helpers Qt's xcb platform plugin links: the install tree bundles them from here
      # (cmake/packaging/linux/BundleLibraries.cmake), and install.smoke fails without them.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 nasm autoconf automake autoconf-archive libtool pkg-config \
            libva-dev libdrm-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libasound2-dev libpulse-dev libsecret-1-dev libfontconfig1-dev libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm autoconf automake autoconf-archive libtool pkg-config llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: vcpkg at the manifest baseline
        id: vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          root="$RUNNER_TEMP/vcpkg"
          cache="$RUNNER_TEMP/vcpkg-cache"
          git clone --quiet https://github.com/microsoft/vcpkg "$root"
          git -C "$root" checkout --quiet "$baseline"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$cache"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          # The cache is named by the packages it holds (tools/ci-cache.py vcpkg-key) and saved from main; the release
          # restores main's newest. Package ABIs include the compiler, so vcpkg reuses the packages that still match and
          # builds the rest. The second prefix finds the caches named the old way (image version and file hashes).
          echo "prefix=vcpkg-$ImageOS-${{ matrix.preset }}-" >> "$GITHUB_OUTPUT"
          echo "legacy=vcpkg-$ImageOS-" >> "$GITHUB_OUTPUT"

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg.outputs.prefix }}newest
          restore-keys: |
            ${{ steps.vcpkg.outputs.prefix }}
            ${{ steps.vcpkg.outputs.legacy }}

      # Wabcut's own objects: saved from main, restored by everything else (tools/ci-cache.py).
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: ccache-${{ matrix.preset }}-

      # Without ccache (a failed download) the build runs as before, only slower.
      - name: ccache
        id: ccache
        continue-on-error: true
        run: python3 tools/ci-cache.py ccache-setup --max-size ${{ matrix.ccache_size }} ${{ github.ref != 'refs/heads/main' && '--read-only' || '' }}

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          install-deps: true
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure and build
        id: build
        run: |
          # The QtKeychain overlay port builds against this Qt (cmake/ports/qtkeychain).
          export WABCUT_QT_DIR="$QT_ROOT_DIR"
          export VCPKG_KEEP_ENV_VARS="WABCUT_QT_DIR;LLVM_ROOT"
          cmake --preset ${{ matrix.preset }} ${{ matrix.configure }} \
            -DWABCUT_WITH_LOCAL_AI=OFF -DWABCUT_WITH_ONNX=ON -DWABCUT_BUILD_NUMBER=${{ github.run_number }} \
            ${CCACHE_EXE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_EXE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_EXE} \
            -DCMAKE_OPTIMIZE_DEPENDENCIES=ON
          # -k 0: a failed build still compiles everything else, so one run shows every error.
          cmake --build --preset ${{ matrix.preset }} -- -k 0

      # A failed port build says only which port failed: its logs are in vcpkg's buildtrees.
      - name: Configure and vcpkg logs (after a failure)
        if: failure()
        run: |
          log=build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          if [ -f "$log" ]; then tail -n 100 "$log"; fi
          find "$VCPKG_ROOT/buildtrees" -maxdepth 2 \( -name '*-err.log' -o -name 'config-*-out.log' \) -size +0 2>/dev/null |
            while read -r f; do echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"; done

      # A build with errors still compiled everything it could (-k 0), so its cache is worth keeping too; one that
      # compiled nothing (a failed configure) is not saved.
      - name: Compiler cache statistics
        id: ccache-stats
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: python3 tools/ci-cache.py ccache-finish ${{ github.ref == 'refs/heads/main' && '--trim' || '' }}

      # Saved straight after the build, not after the tests, so a release started meanwhile already finds it.
      - name: Save the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache-stats.outputs.compiled != '' && steps.ccache-stats.outputs.compiled != '0' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: vcpkg cache key
        id: vcpkg-key
        if: always() && steps.vcpkg.outcome == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          python3 tools/ci-cache.py vcpkg-key --build-dir build/${{ matrix.preset }} --cache "${{ steps.vcpkg.outputs.cache }}" \
            --prefix "${{ steps.vcpkg.outputs.prefix }}"

      # Saved even when a later step fails, so the next run does not rebuild FFmpeg; not when nothing new was built. A run
      # started by hand on another branch saves it for that branch (a branch that changes the dependencies).
      - name: Save the vcpkg binary cache
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.vcpkg-key.outputs.key != '' && steps.vcpkg-key.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg-key.outputs.key }}

      # One cache of each kind per branch: older ones only take room from the repository's 10 GB.
      - name: Delete older caches
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_KEY: ${{ steps.vcpkg-key.outputs.key }}
        run: |
          python3 tools/ci-cache.py delete-older --ref "$GITHUB_REF" --prefix ccache-${{ matrix.preset }}- --keep "$CCACHE_KEY"
          if [ -n "$VCPKG_KEY" ]; then
            python3 tools/ci-cache.py delete-older --ref "$GITHUB_REF" --prefix "${{ steps.vcpkg.outputs.prefix }}" --keep "$VCPKG_KEY"
          fi

      # Runs even when some targets failed to build (their tests show as Not Run), so one run reports everything.
      - name: Test (without gpu and audio-device tests)
        if: always() && steps.build.outcome != 'skipped'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ${{ matrix.preset }} -j 3 --output-junit "$GITHUB_WORKSPACE/ctest-${{ matrix.preset }}.xml"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-${{ matrix.preset }}
          path: ctest-${{ matrix.preset }}.xml
          if-no-files-found: ignore

      - name: Install tree and archive
        if: always()
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$RUNNER_TEMP/wabcut"
          cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -G TGZ -B build/${{ matrix.preset }}/package

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wabcut-${{ matrix.preset }}-unverified
          path: build/${{ matrix.preset }}/package/*.tar.gz
          if-no-files-found: warn
