[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wabcut"
dynamic = ["version"]
description = "Script Wabcut from Python: the same typed commands the app, wabcut-cli and the AI assistant use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
keywords = ["video", "editing", "automation", "wabcut"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
# No dependencies: the package uses the standard library and Wabcut's own wabcut-cli.
dependencies = []

[tool.setuptools]
packages = ["wabcut"]

[tool.setuptools.dynamic]
version = { attr = "wabcut._version.__version__" }

[tool.setuptools.package-data]
wabcut = ["catalog.json", "_commands.pyi", "py.typed"]
